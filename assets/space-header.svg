<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="75%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="50" r="2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="170" cy="90" r="1.5">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>

    <circle cx="280" cy="45" r="2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
    </circle>

    <circle cx="390" cy="110" r="1.2">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="520" cy="55" r="2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>

    <circle cx="660" cy="95" r="1.5">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.9s" repeatCount="indefinite"/>
    </circle>

    <circle cx="800" cy="40" r="2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="930" cy="80" r="1.5">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1090" cy="50" r="2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Planet -->
  <circle cx="1080" cy="55" r="65" fill="#1d4ed8" opacity="0.25"/>
  <circle cx="1060" cy="35" r="45" fill="#60a5fa" opacity="0.12"/>

  <!-- Rocket -->
  <g>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 100; 0 -240"
      dur="5s"
      repeatCount="indefinite"/>

    <text x="980" y="260" font-size="72">🚀</text>

    <line x1="1017" y1="270"
          x2="1017" y2="320"
          stroke="#fb923c"
          stroke-width="7"
          stroke-linecap="round">
      <animate attributeName="opacity"
               values="1;0.2;1"
               dur="0.25s"
               repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Main text -->
  <text x="600"
        y="120"
        text-anchor="middle"
        fill="#ffffff"
        font-family="Arial, sans-serif"
        font-size="40"
        font-weight="700">
    JUNIOR R. CARPENTER
  </text>

  <text x="600"
        y="165"
        text-anchor="middle"
        fill="#38bdf8"
        font-family="Arial, sans-serif"
        font-size="19"
        letter-spacing="5">
    SOFTWARE ENGINEER
  </text>

  <text x="600"
        y="215"
        text-anchor="middle"
        fill="#cbd5e1"
        font-family="Arial, sans-serif"
        font-size="17">
    Exploring the universe, one line of code at a time.
  </text>

</svg>
